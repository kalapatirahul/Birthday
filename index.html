<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise — Mahati</title>
<style>
:root{
  --bg:#0b0b0b;
  --white:#ffffff;
  --red:#e23b3b;
}

html, body{
  margin:0;
  height:100%;
  background:var(--bg);
  font-family:"Arial Black","Impact",system-ui,-apple-system,"Segoe UI Black",sans-serif;
  overflow:hidden;
  color:var(--white);
  transition: background 1s;
}

.stage{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  cursor:pointer;
  flex-direction:column;
  padding:20px;
  text-align:center;
}

/* Gift box */
#giftBtn{
  width:160px;
  height:160px;
  display:flex;
  align-items:center;
  justify-content:center;
  perspective:800px;
}
#giftBox{
  width:100%;
  height:100%;
  background:#fff;
  position:relative;
  border-radius:10px;
  transform-style: preserve-3d;
  transform: scale(0);
  box-shadow:0 0 20px #fff;
}
.ribbon-vertical, .ribbon-horizontal{
  position:absolute;
  background:var(--red);
}
.ribbon-vertical{
  width:20px;
  height:100%;
  left:50%;
  top:0;
  transform:translateX(-50%);
}
.ribbon-horizontal{
  height:20px;
  width:100%;
  top:50%;
  left:0;
  transform:translateY(-50%);
}
#giftBox.pop{
  animation: popGift 0.6s forwards;
}
@keyframes popGift{
  0%{transform: scale(0);}
  100%{transform: scale(1);}
}

/* Text container */
.text{
  text-align:center;
  cursor:pointer;
  display:none;
  max-width:900px;
}
.text p{
  font-size:1.2rem;
  line-height:1.6;
  color:var(--white);
  margin-bottom:30px;
  word-wrap:break-word;
}
.text h1{
  font-size:5rem;
  font-weight:900;
  margin:0.3em 0;
  text-shadow:0 0 8px rgba(0,0,0,0.7);
}
.text h1.first{
  color:var(--white);
  text-shadow:0 0 5px #fff, 0 0 8px #fff;
}
.text h1.second{
  color:var(--red);
  text-shadow:0 0 5px #e23b3b,0 0 8px #e23b3b;
}

/* Letter blast effect */
.letter{
  display:inline-block;
  opacity:1;
  transform:scale(1);
}
.letter.blast{
  animation: letterBlast 0.8s forwards cubic-bezier(.2,.9,.2,1);
  transform-origin:center;
}
@keyframes letterBlast{
  0%{transform:scale(1); opacity:1;}
  60%{transform:scale(2.5); opacity:0.7; filter:blur(1px);}
  100%{transform:scale(4); opacity:0; filter:blur(6px);}
}

/* Fade-in for LR */
.fade-in {
  opacity: 0;
  animation: fadeIn 1s forwards;
}
@keyframes fadeIn {
  0% { opacity: 0; transform: scale(0.8); }
  100% { opacity: 1; transform: scale(1); }
}

/* Responsive */
@media(max-width:420px){
  .text h1{font-size:3rem;}
  .text p{font-size:1rem;}
}
</style>
</head>
<body>
<div class="stage" id="stage">

  <!-- Gift -->
  <div id="giftBtn">
    <div id="giftBox">
      <div class="ribbon-vertical"></div>
      <div class="ribbon-horizontal"></div>
    </div>
  </div>

  <!-- Birthday message + Happy Birthday MAHATI -->
  <div class="text" id="messageText">
    <p id="birthdayMessage"></p>
    <h1 class="first" id="happyText">Happy Birthday</h1>
    <h1 class="second" id="nameText">MAHATI</h1>
  </div>

  <!-- They call her / LR Text -->
  <div class="text" id="ogText">
    <h1 class="first" id="theyCall"></h1>
    <h1 class="second" id="lr">LR</h1>
  </div>

</div>

<script>
const stage = document.getElementById('stage');
const giftBox = document.getElementById('giftBox');
const messageText = document.getElementById('messageText');
const birthdayMessage = document.getElementById('birthdayMessage');
const happyText = document.getElementById('happyText');
const nameText = document.getElementById('nameText');
const ogText = document.getElementById('ogText');
const theyCall = document.getElementById('theyCall');
const lr = document.getElementById('lr');

// Music setup
const ogMusic = new Audio('og_music.mp3'); 
const ogTitle = new Audio('og_title.mp3'); 
ogMusic.loop = true;
ogTitle.loop = true;
ogMusic.volume = 0.3;
ogTitle.volume = 0.3;

let state = 'start';

// Gift pop animation
giftBox.classList.add('pop');

// Split letters of MAHATI
function splitLetters(){
  const letters = nameText.textContent.split('');
  nameText.innerHTML = '';
  letters.forEach(l => {
    const span = document.createElement('span');
    span.className = 'letter';
    span.textContent = l;
    nameText.appendChild(span);
  });
}

// Blast letters
function blastLetters(callback){
  const letters = nameText.querySelectorAll('.letter');
  letters.forEach((l,i)=>{
    setTimeout(()=> l.classList.add('blast'), i*120);
  });
  setTimeout(callback, letters.length*120 + 800);
}

// Typewriter effect
function typeWriterLetters(textElement, text, callback, delay=40){
  textElement.textContent='';
  let i = 0;
  function next(){
    if(i < text.length){
      textElement.textContent += text[i];
      i++;
      setTimeout(next, delay);
    } else {
      if(callback) callback();
    }
  }
  next();
}

// Show birthday message
function showMessage(){
  if(state!=='start') return;
  state='messageShown';
  giftBox.parentElement.style.display='none';
  messageText.style.display='block';
  happyText.style.display='block';
  nameText.style.display='block';
  
  ogMusic.play(); // Start OG music when gift clicked

  happyText.textContent = ''; 
  nameText.textContent = '';

  const message = "Wishing you a day full of laughter, joy, and everything amazing you deserve. May this year bring exciting adventures, unforgettable memories, and endless happiness. Keep shining, and hope you have an incredible year ahead.";

  typeWriterLetters(birthdayMessage, message, ()=>{
    typeWriterLetters(happyText, "Happy Birthday", ()=>{
      typeWriterLetters(nameText, "MAHATI", ()=>{
        splitLetters();
        state='readyForClick';
        nameText.style.cursor = "pointer";
        nameText.addEventListener('click', animateName);
      }, 100);
    }, 100);
  }, 30);
}

// Animate MAHATI blast → black screen → They call her → LR
function animateName(){
  if(state!=='readyForClick') return;
  state='nameBlast';
  blastLetters(()=>{
    ogMusic.pause(); // stop OG music exactly after MAHATI
    document.body.style.background='#000';
    messageText.style.display='none';
    ogText.style.display='block';
    theyCall.style.opacity = 1;
    lr.style.opacity = 0;

    // Start OG title music when "They call her" starts (looped)
    ogTitle.play();

    typeWriterLetters(theyCall,"They call her", ()=>{
      lr.classList.add('fade-in');
    }, 150);
  });
}

// Stage click
stage.addEventListener('click', ()=>{
  if(state==='start') showMessage();
});
</script>
</body>
</html>
